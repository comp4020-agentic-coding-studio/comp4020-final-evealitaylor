<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Seat Seeker — Hancock Level 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/public/style.css" />
</head>
<body>
<header class="topbar">
  <a class="brand" href="/" aria-label="Seat Seeker">
    <span class="wordmark">Seat Seeker</span>
    <svg class="brand-icon" viewBox="0 0 40 40" aria-hidden="true">
      <line x1="24" y1="24" x2="35" y2="35" stroke="#fff" stroke-width="5" stroke-linecap="round" />
      <circle cx="16" cy="16" r="12" fill="#23597a" stroke="#fff" stroke-width="3.5" />
      <path d="M11 8.5c0-.8.7-1.3 1.5-1.2l3 .5c.6.1 1 .6 1 1.2l.3 7.5 4.7 1.6c.7.3.6 1.3-.1 1.4l-8.6.6c-.7 0-1.3-.5-1.3-1.2z" fill="#1ccc5b" />
      <path d="M12.5 20.5l-.6 3.5M15.5 21l.1 3.6M19.7 20.3l.6 3.2" stroke="#fff" stroke-width="1.3" stroke-linecap="round" />
    </svg>
  </a>
  <a class="icon-btn" href="/readme/" aria-label="About this app">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2.2" /><path d="M12 11v6M12 7.2v.1" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" /></svg>
  </a>
</header>

<main class="layout">
  <section class="floor">
    <nav class="crumbs" aria-label="Breadcrumb">ANU <span>›</span> Hancock Library <span>›</span> Level 2</nav>
    <div class="level-head">
      <div>
        <h1>Level 2</h1>
        <p class="sub">Hancock Library · <span id="free-count">loading…</span></p>
      </div>
      <span id="level-pill" class="pill" hidden></span>
    </div>

    <div class="map-card">
      <svg id="map" viewBox="0 0 600 1160" role="group" aria-label="Level 2 floor plan"></svg>
    </div>

    <ul class="legend" aria-label="Legend">
      <li><span class="key key--available"></span>Free</li>
      <li><span class="key key--pending"></span>Claimed, awaiting check-in</li>
      <li><span class="key key--occupied"></span>Occupied</li>
      <li><span class="key key--report"></span>Someone's recent report</li>
      <li><span class="key key--mismatch"></span>Report disagrees with claim</li>
    </ul>
    <p class="fine">Floor plan is illustrative. Desk counts and positions are estimates, not a survey.</p>
  </section>

  <aside id="sheet" class="sheet" aria-live="polite" aria-label="Desk details">
    <div class="sheet-handle" aria-hidden="true"></div>
    <div id="sheet-body"></div>
  </aside>
</main>

<script src="/public/app.js" type="module"></script>
</body>
</html>
